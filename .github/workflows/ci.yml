name: CI

on:
  push:
    branches: [main, feature/m12, feature/m11-teb-stack-bounds, feature/m11-native-execution-phase5]
  pull_request:
    branches: [main, feature/m12, feature/m11-native-execution-slice, feature/m11-test-binaries, feature/m11-teb-peb-tls, feature/m11-teb-stack-bounds]
  workflow_dispatch:

jobs:
  asset-policy:
    name: Asset policy (no binaries, archives or oversized files)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test the asset-policy checker
        run: python3 scripts/check_assets_test.py

      # The same check as scripts/hooks/pre-commit, over the whole tree, so
      # the policy holds where the hook is not installed.  On a pull request
      # the checkout is the merge result, so the merged tree is what is
      # checked.  See docs/input-policy.md.
      - name: Reject binaries, archives and oversized files
        run: python3 scripts/check_assets.py --all --annotations

  build-and-test:
    name: ${{ matrix.build_type }} · ${{ matrix.compiler }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        build_type: [Release, Debug]
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          else
            sudo apt-get install -y g++
          fi

      - name: Configure
        run: cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_INSTALL_PREFIX=/usr/local

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Run M9 synthetic benchmarks
        if: matrix.build_type == 'Release' && matrix.compiler == 'gcc'
        run: ./build/tests/m9_bench

  # Rule 5 of the M12 plan: the sanitizers stay green with every feature flag
  # on and off.  Each flag becomes a matrix axis here as it is introduced;
  # XBOX2PC_NATIVE_EXECUTION is the only one today.
  sanitize:
    name: ASan + UBSan (native ${{ matrix.native }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        native: ["OFF", "ON"]
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Configure (AddressSanitizer + UndefinedBehaviorSanitizer)
        run: cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DXBOX2PC_NATIVE_EXECUTION=${{ matrix.native }}
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build (test binaries)
        run: cmake --build build-asan

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  thread-sanitize:
    name: TSan (native ${{ matrix.native }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        native: ["OFF", "ON"]
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Configure (ThreadSanitizer)
        run: cmake -S . -B build-tsan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DXBOX2PC_NATIVE_EXECUTION=${{ matrix.native }}
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build-tsan

      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure
        env:
          TSAN_OPTIONS: halt_on_error=1

  native-execution:
    name: Native execution (XBOX2PC_NATIVE_EXECUTION=ON)
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ ninja-build

      - name: Configure (native execution flag ON)
        run: cmake -S . -B build-native -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DXBOX2PC_NATIVE_EXECUTION=ON

      - name: Build
        run: cmake --build build-native --parallel 2

      - name: Test (native backend integration + determinism)
        run: ctest --test-dir build-native --output-on-failure

  m11-pe-fixtures:
    name: M11 PE fixtures + static goldens
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchains and inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld g++-mingw-w64-x86-64 ninja-build

      - name: Configure Xbox2PC CLI
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Xbox2PC
        run: cmake --build build --parallel 2

      - name: Build both synthetic Windows PE fixtures
        run: scripts/build-m11-samples.sh

      # M12 P0: execute a compiler-built PE, not only inspect it. The
      # freestanding sample now runs to completion through all 13 of its
      # imports on the native backend: VirtualAlloc, VirtualQuery (with its
      # 48-byte out structure on the guest stack), VirtualProtect,
      # VirtualFree, the event/sync set, last-error, TLS, and ExitProcess —
      # it must return 42 (docs/m12-what-broke.md, entries 10, 12 and 15).
      - name: Run the freestanding sample through xbox2pc run (native backend)
        run: |
          cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DXBOX2PC_NATIVE_EXECUTION=ON
          cmake --build build-native --target xbox2pc --parallel 2
          set +e
          build-native/tools/xbox2pc run build/m11-samples/m11_freestanding.exe \
            --backend native --json build/m11-samples/run-native.json
          echo "xbox2pc run exit status: $?"
          set -e
          python3 - <<'PY'
          import json
          r = json.load(open("build/m11-samples/run-native.json"))
          assert r["ran"] is True, r
          assert r["imports"]["total"] == 13, r["imports"]
          assert r["imports"]["resolved"] == 13, r["imports"]
          assert r["unimplemented"] == "strict", r
          assert r["outcome"] == "returned", r
          assert r["exit_code"] == 42, r
          assert r["api_calls"] == 13, r
          print("m11_freestanding.exe on the native backend:", r["outcome"],
                "exit", r["exit_code"], "|", r["api_calls"], "API calls")
          PY

      - name: Verify imports, TLS directory, and C++ unwind metadata
        run: |
          python3 - <<'PY'
          import subprocess

          basic = "build/m11-samples/m11_freestanding.exe"
          cpp = "build/m11-samples/m11_cpp_exceptions.exe"

          def dump(path):
              return subprocess.check_output(
                  ["objdump", "-p", path], text=True)

          basic_text = dump(basic)
          imports = [
              line.split("DLL Name:", 1)[1].strip()
              for line in basic_text.splitlines()
              if "DLL Name:" in line
          ]
          assert imports == ["kernel32.dll"], imports
          required_imports = {
              "GetCurrentProcessId", "GetCurrentThreadId",
              "VirtualAlloc", "VirtualQuery", "VirtualProtect", "VirtualFree",
              "CreateEventW", "SetEvent", "WaitForSingleObject", "CloseHandle",
              "SetLastError", "GetLastError", "ExitProcess",
          }
          assert required_imports.issubset(set(basic_text.split())), required_imports

          disassembly = subprocess.check_output(
              ["objdump", "-d", basic], text=True)
          assert "%gs:0x58" in disassembly, "compiler-generated TLS read missing"

          def directory(text, label):
              line = next(
                  item for item in text.splitlines()
                  if label in item
              )
              fields = line.split()
              return int(fields[2], 16), int(fields[3], 16)

          tls_rva, tls_size = directory(
              basic_text, "Thread Storage Directory [.tls]")
          assert tls_rva and tls_size, (tls_rva, tls_size)

          cpp_text = dump(cpp)
          pdata_rva, pdata_size = directory(
              cpp_text, "Exception Directory [.pdata]")
          assert pdata_rva and pdata_size, (pdata_rva, pdata_size)
          print(f"freestanding imports={imports}, TLS RVA=0x{tls_rva:x}, size=0x{tls_size:x}")
          print(f"C++ .pdata RVA=0x{pdata_rva:x}, size=0x{pdata_size:x}")
          PY

      - name: Capture inspect, validate-pe, and compat-report goldens
        run: scripts/capture-m11-goldens.sh

      - name: Verify committed static golden hashes
        run: sha256sum --check samples/m11/golden/SHA256SUMS.txt

      - name: Require both fixture validation reports to be valid
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("m11_freestanding", "m11_cpp_exceptions"):
              path = Path("samples/m11/golden") / f"{name}.validate-pe.json"
              report = json.loads(path.read_text())
              assert report["valid"], f"{name} rejected: {report.get('issues')}"
              inspect = (Path("samples/m11/golden") / f"{name}.inspect.txt").read_text()
              assert "image_type:    executable" in inspect, f"{name} misclassified by inspect"
              print(f"{name}: PE validation and executable classification passed")
          # The compat-report reflects the registry's descriptor policy
          # (not build output), so it is content-checked, not hash-checked:
          # kernel32's SetLastError/GetLastError/ExitProcess must all be
          # reported as implemented for the freestanding sample.
          freestanding = json.loads(
              (Path("samples/m11/golden") / "m11_freestanding.compat-report.json").read_text())
          text = json.dumps(freestanding)
          for symbol in ("SetLastError", "GetLastError", "ExitProcess"):
              assert symbol in text, f"{symbol} missing from the compat report"
          print("compat-report descriptor policy verified (incl. ExitProcess)")
          PY

      - name: Upload PE fixtures, hashes, and golden outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m11-phase1-pe-fixtures
          path: |
            build/m11-samples/m11_freestanding.exe
            build/m11-samples/m11_cpp_exceptions.exe
            build/m11-samples/SHA256SUMS.txt
            samples/m11/golden/
          if-no-files-found: error

  # M12 P0.2: the rung ladder (plan section 3.2).  Every rung is built from
  # project-authored source with clang + lld-link, executed through
  # `xbox2pc run --backend native --unimplemented trap`, and compared with
  # its committed golden.  A rung counts as passing only when it returns its
  # contract exit code; one that stops on an unimplemented import is
  # reported as blocked, never as passing (samples/rungs/README.md).
  rung-fixtures:
    name: M12 rung fixtures B-G (built from source, executed, goldens)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchains and inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build

      - name: Build the CLI with the native backend
        run: |
          cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DXBOX2PC_NATIVE_EXECUTION=ON
          cmake --build build-native --target xbox2pc --parallel 2

      - name: Build the rung fixtures from source
        run: scripts/build-rung-fixtures.sh

      - name: Run the ladder and compare with the committed goldens
        run: python3 scripts/rung_check.py --cli build-native/tools/xbox2pc --dir build/rungs

      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m12-rung-run-reports
          path: build/rungs/*.run.json
          if-no-files-found: error
